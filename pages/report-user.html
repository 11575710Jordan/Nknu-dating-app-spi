<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>提交檢舉 - 交友 App</title>
  
  <!-- 引入 Google 品牌字型 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">

  <!-- 引用外部樣式表 -->
  <link rel="stylesheet" href="../theme_guide/theme.css">
  <link rel="stylesheet" href="../css/report-user.css">
</head>
<body>

  <div class="dp-card">
    <!-- 頂部返回導覽與標題區塊 -->
    <div class="dp-header">
      <div class="dp-header-top">
        <a href="user-center.html" class="dp-btn-back" id="backBtn" title="返回個人中心">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20">
            <polyline points="15 18 9 12 15 6"></polyline>
          </svg>
          <span>個人中心</span>
        </a>
      </div>

      <div class="dp-badge">
        <svg class="dp-badge-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>
          <line x1="12" y1="9" x2="12" y2="13"></line>
          <line x1="12" y1="17" x2="12.01" y2="17"></line>
        </svg>
        隱私與安全- 社群秩序維護
      </div>
      <h1>建立檢舉單</h1>
      <p>若遇到不當言論、詐騙或騷擾行為，請填寫以下資訊，平台將於 24 小時內審核處理。</p>
    </div>

    <form id="reportForm">
      <!-- 檢舉對象選擇（從個人中心進入時顯示） -->
      <div class="dp-field" id="userSelectGroup">
        <label class="dp-label" for="reportedUserSelect">選擇檢舉對象<span class="required">*</span></label>
        <select class="dp-select" id="reportedUserSelect">
          <option value="">-- 請選擇近期曾對話的用戶 --</option>
          <option value="user_001" data-avatar="https://picsum.photos/80/80?random=1" data-time="10 分鐘前訊息">
            Alex (最近對話：10 分鐘前)
          </option>
          <option value="user_002" data-avatar="https://picsum.photos/80/80?random=2" data-time="昨天 22:15">
            Chris (最近對話：昨天 22:15)
          </option>
          <option value="user_003" data-avatar="https://picsum.photos/80/80?random=3" data-time="3 天前">
            Jordan (最近對話：3 天前)
          </option>
          <option value="manual_search">🔍 找不到對象？手動輸入 User ID</option>
        </select>
      </div>

      <!-- 被檢舉對象卡片預覽（動態顯示） -->
      <div class="dp-target-preview" id="targetPreview" style="display: none;">
        <img id="targetAvatar" src="https://picsum.photos/80/80?random=99" alt="對象頭像" class="dp-preview-avatar">
        <div class="dp-preview-info">
          <strong id="targetName">使用者名稱</strong>
          <span id="targetDetail" class="dp-preview-detail">最近對話時間</span>
        </div>
      </div>

      <!-- 手動輸入 User ID 欄位（選擇手動輸入時顯示） -->
      <div class="dp-field" id="manualIdGroup" style="display: none;">
        <label class="dp-label" for="manualUserId">對方 User ID / 帳號暱稱<span class="required">*</span></label>
        <input type="text" class="dp-input" id="manualUserId" placeholder="例如：@alex_123">
      </div>

      <!-- 檢舉事由類別 -->
      <div class="dp-field">
        <label class="dp-label" for="reportCategory">違規類型<span class="required">*</span></label>
        <select class="dp-select" id="reportCategory" required>
          <option value="">請選擇違規原因</option>
          <option value="HARASSMENT">言語騷擾 / 仇恨言論</option>
          <option value="FRAUD">詐騙 / 推銷 / 商業廣告</option>
          <option value="FAKE_PROFILE">假冒他人 / 虛假資料</option>
          <option value="INAPPROPRIATE_MEDIA">傳送不雅或不當圖片</option>
          <option value="OTHER">其他違反社群規範之行為</option>
        </select>
      </div>

      <!-- 詳細說明 -->
      <div class="dp-field">
        <label class="dp-label" for="reportReason">詳細說明<span class="required">*</span></label>
        <textarea class="dp-textarea" id="reportReason" placeholder="請具體描述對方違規的過程或時間點..." required></textarea>
      </div>

      <!-- 上傳對話截圖 / 證明圖片 -->
      <div class="dp-field">
        <label class="dp-label">上傳違規證明 / 對話截圖（選填，最多 3 張）</label>
        <div class="dp-upload-box" id="screenshotUploadBox">
          <input type="file" id="screenshotInput" accept="image/*" multiple class="dp-file-input">
          <div class="dp-upload-placeholder" id="uploadPlaceholder">
            <svg class="dp-upload-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="32" height="32">
              <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
              <circle cx="8.5" cy="8.5" r="1.5"></circle>
              <polyline points="21 15 16 10 5 21"></polyline>
            </svg>
            <span class="dp-upload-text">點擊或拖曳上傳截圖</span>
            <span class="dp-upload-subtext">支援 JPG、PNG 格式</span>
          </div>
        </div>
        <!-- 截圖預覽容器 -->
        <div class="dp-screenshot-grid" id="screenshotGrid"></div>
      </div>

      <!-- 提示訊息 -->
      <div class="dp-alert" id="alertMessage" aria-live="polite"></div>

      <!-- 提交按鈕 -->
      <button type="submit" class="dp-btn-submit">提交檢舉單</button>
    </form>
  </div>

  <script src="report-user.js"></script>
</body>
</html>
