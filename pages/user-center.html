<!doctype html>
<html lang="zh-Hant">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>個人中心｜Dating POC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<!-- SVG Icon Sprite 定義區（確保圖示正常顯示） -->
<svg style="display: none;">

  <symbol id="i-hearts" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></symbol>
  <symbol id="i-chat" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 5h16v11H9l-5 4z"/></symbol>
  <symbol id="i-user" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></symbol>
</svg>

<div class="dp-shell dp-shell--no-aside match-shell">

  <nav class="dp-shell__nav" aria-label="主要導覽">
    <div class="dp-logo">Dating POC</div>

    <a class="dp-nav-item" href="match.html"><svg><use href="#i-hearts"/></svg><span>配對</span></a>
    <a class="dp-nav-item" href="chat.html"><svg><use href="#i-chat"/></svg><span>訊息</span></a>
    <a class="dp-nav-item" href="user-center.html" aria-current="page"><svg><use href="#i-user"/></svg><span>我的檔案</span></a>
  </nav>

  <main class="dp-shell__main">
    <div class="dp-shell__main-inner">
      
      <!-- 【區塊二：中上方 - 固定個人身分資訊卡片】 -->
      <div class="dp-card dp-card--header">
        <div class="dp-profile-header">
          <div class="dp-avatar-wrapper">
            <img src="https://picsum.photos/120/120?random=20" alt="個人頭像" class="dp-avatar">
            <span class="dp-badge-verified" title="已完成實名認證">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <polyline points="20 6 9 17 4 12"></polyline>
              </svg>
            </span>
          </div>
          <div class="dp-profile-meta">
            <h2 class="dp-user-name">CcCo</h2>
            <p class="dp-user-id">ID: @chiahuei_l</p>
          </div>
        </div>

        <!-- 社群健康度橫條 -->
        <a href="hate-monitoring.html" class="dp-health-card">
          <div class="dp-health-info">
            <span class="dp-health-title">社群健康度與風險指數</span>
            <span class="dp-health-status">良好 (Hate Score: 15/100)</span>
          </div>
          <svg class="dp-arrow-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="9 18 15 12 9 6"></polyline>
          </svg>
        </a>

            <a href="match.html" class="dp-menu-item">
              <div class="dp-menu-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <circle cx="12" cy="12" r="9"></circle>
                  <path fill="currentColor" stroke="none" d="M15.8 8.2l-2.2 5.4-5.4 2.2 2.2-5.4z"></path>
                </svg>
              </div>
              <span class="dp-menu-text">配對探索</span>
              <svg class="dp-arrow-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"></polyline></svg>
            </a>
            <a href="chat.html" class="dp-menu-item">

              <span class="dp-menu-text">訊息</span>

            <a href="profile-settings.html" class="dp-menu-item">
              <div class="dp-menu-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                  <circle cx="12" cy="7" r="4"></circle>

                  <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
                  <path d="M9 12l2 2 4-4"></path>
                </svg>
              </div>
              <div class="dp-menu-content">
                <span class="dp-menu-text">實名與真人認證</span>
                <span class="dp-tag-success">已驗證</span>
              </div>
              <svg class="dp-arrow-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"></polyline></svg>

                    <circle cx="12" cy="12" r="10"></circle>
                    <line x1="4.93" y1="4.93" x2="19.07" y2="19.07"></line>

              </a>

              <a href="report-user.html" class="dp-menu-item">
                <div class="dp-menu-icon">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>

                <svg class="dp-arrow-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"></polyline></svg>

                <span class="dp-menu-text">集點系統</span><span class="dp-404__tag">開發中</span>
                <svg class="dp-arrow-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"></polyline></svg>
