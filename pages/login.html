<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>帳號登入 - 交友 App</title>
  
  <!-- 引入 Google 品牌字型 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">

  <!-- 引用外部樣式表 -->
  <link rel="stylesheet" href="../theme_guide/theme.css">
  <link rel="stylesheet" href="../css/login.css">
</head>
<body>

  <div class="dp-card">
    <div class="dp-header">
      <h1>歡迎回來</h1>
      <p>登入帳號以繼續探索專屬於你的心動連線</p>
    </div>

    <!-- Demo 用測試帳號（資料來自 data/mock-data.js） -->
    <div class="dp-demo-hint">
      <p><strong>測試帳號</strong>：<code>u01@nknu-demo.app</code>～<code>u14@nknu-demo.app</code></p>
      <p><strong>密碼</strong>：<code>demo1234</code>（<code>u11</code>～<code>u14</code> 為 65 歲以上，會進入長輩模式）</p>
    </div>

    <form id="loginForm">
      <!-- Email 輸入欄位 -->
      <div class="dp-field">
        <label class="dp-label" for="email">電子郵件<span class="required">*</span></label>
        <input type="email" class="dp-input" id="email" placeholder="name@example.com" required autocomplete="email">
      </div>

      <!-- 密碼輸入欄位 (含顯示/隱藏按鈕) -->
      <div class="dp-field">
        <div class="dp-label-row">
          <label class="dp-label" for="password">密碼<span class="required">*</span></label>
          <a href="forgot-password.html" class="dp-forgot-link">忘記密碼？</a>
        </div>
        <div class="dp-input-wrapper">
          <input type="password" class="dp-input" id="password" placeholder="請輸入密碼" required autocomplete="current-password">
          <button type="button" class="dp-password-toggle" id="togglePassword" aria-label="切換密碼顯示">
            <svg id="eyeIcon" class="dp-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
          </button>
        </div>
      </div>

      <!-- 記住我 勾選框 -->
      <div class="dp-remember-row">
        <label class="dp-checkbox-label">
          <input type="checkbox" id="rememberMe" class="dp-checkbox">
          <span>保持登入狀態</span>
        </label>
      </div>

      <!-- 提示訊息 -->
      <div class="dp-alert" id="alertMessage" aria-live="polite"></div>

      <!-- 提交按鈕 -->
      <button type="submit" class="dp-btn-submit" id="submitBtn">登入</button>
    </form>

    <!-- 第三方快捷登入分隔線 -->
    <div class="dp-divider">
      <span>或使用其他方式登入</span>
    </div>

    <div class="dp-social-group">
      <button type="button" class="dp-social-btn google" aria-label="使用 Google 帳號登入">
        <svg class="dp-social-icon" viewBox="0 0 24 24">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
        </svg>
      </button>
      <button type="button" class="dp-social-btn apple" aria-label="使用 Apple 帳號登入">
        <svg class="dp-social-icon" viewBox="0 0 24 24" fill="currentColor">
          <path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 6.11c.64-.78 1.08-1.85.96-2.93-.93.04-2.07.62-2.74 1.4-.6.7-1.12 1.8-0.98 2.87 1.04.08 2.12-.55 2.76-1.34z"/>
        </svg>
      </button>
    </div>

    <!-- 註冊新帳號引導 -->
    <div class="dp-footer-link">
      <span>還沒有帳號嗎？</span>
      <a href="profile-settings.html" class="dp-signup-link">立即免費註冊</a>
    </div>
  </div>

  <script src="../data/mock-data.js"></script>
  <script src="../js/session.js"></script>
  <script src="../js/login.js"></script>
</body>
</html>
