<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>配對｜Dating POC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../theme_guide/theme.css">
<link rel="stylesheet" href="match.css">
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-check" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-minus" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" d="M5 12h14"/></symbol>
  <symbol id="i-paw" viewBox="0 0 24 24"><g fill="currentColor"><ellipse cx="6" cy="10" rx="2" ry="2.6"/><ellipse cx="10" cy="6" rx="2" ry="2.6"/><ellipse cx="14" cy="6" rx="2" ry="2.6"/><ellipse cx="18" cy="10" rx="2" ry="2.6"/><path d="M12 11c-3 0-6 4.2-6 6.6 0 1.6 1.3 2.4 3 2.4 1.2 0 2-.6 3-.6s1.8.6 3 .6c1.7 0 3-.8 3-2.4C18 15.2 15 11 12 11z"/></g></symbol>
  <symbol id="i-people" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c1-3.5 3.6-5 6.5-5s5.5 1.5 6.5 5"/><circle cx="17" cy="9" r="2.8"/><path d="M17 14.5c2.3 0 4 1.3 4.8 4"/></g></symbol>
  <symbol id="i-sun" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2.5M12 19v2.5M2.5 12H5M19 12h2.5M5.3 5.3l1.8 1.8M16.9 16.9l1.8 1.8M5.3 18.7l1.8-1.8M16.9 7.1l1.8-1.8"/></g></symbol>
  <symbol id="i-filter" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M4 6h16M7 12h10M10 18h4"/></symbol>
  <symbol id="i-edit" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" d="M4 20h4L19 9l-4-4L4 16z"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></symbol>
  <symbol id="i-chevron-left" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" d="M15 5l-7 7 7 7"/></symbol>
  <symbol id="i-chevron-right" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/></symbol>
</svg>

<!-- 測試用：還沒有登入頁，先用輸入框指定登入者 -->
<header class="match-account">
  <form class="match-account__form" id="account-form" novalidate>
    <label class="dp-label" for="account-input">測試帳號</label>
    <input class="dp-input" id="account-input" list="account-list" autocomplete="off" placeholder="輸入 u01～u14 或姓名" aria-describedby="account-help">
    <datalist id="account-list"></datalist>
    <button class="dp-btn dp-btn--secondary dp-btn--sm" type="submit">切換帳號</button>
  </form>
  <p class="dp-help" id="account-help" role="status"></p>
  <button class="dp-btn dp-btn--ghost dp-btn--sm match-account__reset" id="demo-reset" type="button">重設示範資料</button>
</header>

<main class="match-main">
  <h1 class="match-sr-only">配對</h1>

  <div class="match-toolbar">
    <div class="match-modes" id="mode-switch" role="group" aria-label="配對模式"></div>
    <div class="match-filter-anchor">
      <button class="dp-btn dp-btn--ghost dp-btn--sm" id="filter-toggle" type="button" aria-expanded="false" aria-controls="filter-panel"></button>
      <form class="match-filter" id="filter-panel" role="dialog" aria-label="篩選條件" novalidate hidden></form>
    </div>
  </div>

  <div class="match-pet-picker" id="pet-picker" hidden></div>

  <section class="match-stage" id="match-stage" aria-live="polite"></section>
</main>

<div id="modal-root"></div>

<script src="../data/mock-data.js"></script>
<script src="../js/match-logic.js"></script>
<script src="match.js"></script>
</body>
</html>
