<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>重設密碼 - 交友 App</title>
  
  <!-- 引入 Google 品牌字型 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">

  <!-- 引用外部樣式表 -->
  <link rel="stylesheet" href="../theme_guide/theme.css">
  <link rel="stylesheet" href="../css/forgot-password.css">
</head>
<body>

  <div class="dp-card">
    <div class="dp-header">
      <h1>忘記密碼？</h1>
      <p>別擔心！請輸入你註冊時使用的 Email，我們將傳送重設密碼連結給你。</p>
    </div>

    <form id="forgotPasswordForm">
      <!-- Email 輸入欄位 -->
      <div class="dp-field">
        <label class="dp-label" for="email">電子郵件<span class="required">*</span></label>
        <input type="email" class="dp-input" id="email" placeholder="name@example.com" required autocomplete="email">
      </div>

      <!-- 訊息提示區塊 (預設隱藏) -->
      <div class="dp-alert" id="alertMessage" aria-live="polite"></div>

      <!-- 提交按鈕 -->
      <button type="submit" class="dp-btn-submit" id="submitBtn">發送重設連結</button>

      <!-- 返回登入頁連結 -->
      <div class="dp-footer-link">
        <a href="login.html" class="dp-back-link">
          <svg class="dp-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
          </svg>
          返回登入
        </a>
      </div>
    </form>
  </div>

  <script src="../js/forgot-password.js"></script>
</body>
</html>
