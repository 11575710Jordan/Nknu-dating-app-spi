<!DOCTYPE html>

  <!-- 引入 Google 品牌字型 -->

  <link rel="stylesheet" href="../theme_guide/theme.css">

<body>

  <div class="dp-card">
    
    <!-- 頂部個人頭像與基本資訊 -->
    <div class="dp-profile-header">
      <div class="dp-avatar-wrapper">
        <img src="https://picsum.photos/120/120?random=20" alt="個人頭像" class="dp-avatar">
        <span class="dp-badge-verified" title="已完成實名認證">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
        </span>
      </div>
      <h2 class="dp-user-name">CcCo</h2>
      <p class="dp-user-id">ID: @chiahuei_l</p>
    </div>

    <!-- 社群健康度與仇恨值快速卡片 -->
    <a href="hate-monitoring.html" class="dp-health-card">
      <div class="dp-health-info">
        <span class="dp-health-title">社群健康度與風險指數</span>
        <span class="dp-health-status">良好 (Hate Score: 15/100)</span>
      </div>
      <svg class="dp-arrow-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polyline points="9 18 15 12 9 6"></polyline>
      </svg>
    </a>

    <!-- 回到配對頁／訊息頁的快速入口（配對、訊息頁的導覽都連回個人中心，但原本缺一個回去的入口） -->
    <div class="dp-menu-group">
      <div class="dp-menu-label">探索與配對</div>

      <a href="match.html" class="dp-menu-item">
        <div class="dp-menu-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="9"></circle>
            <path fill="currentColor" stroke="none" d="M15.8 8.2l-2.2 5.4-5.4 2.2 2.2-5.4z"></path>
          </svg>
        </div>
        <span class="dp-menu-text">配對探索</span>
        <svg class="dp-arrow-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="9 18 15 12 9 6"></polyline>
        </svg>
      </a>

      <a href="chat.html" class="dp-menu-item">
        <div class="dp-menu-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M4 5h16v11H9l-5 4z"></path>
          </svg>
        </div>
        <span class="dp-menu-text">訊息</span>
        <svg class="dp-arrow-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="9 18 15 12 9 6"></polyline>
        </svg>
      </a>
    </div>

    <div class="dp-menu-group">
      <div class="dp-menu-label">帳號與身份設定</div>

      <!-- 1. 基本資料編輯 -->
      <a href="profile-settings.html" class="dp-menu-item">
        <div class="dp-menu-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>

        </div>
        <span class="dp-menu-text">編輯個人資料與簡介</span>
        <svg class="dp-arrow-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="9 18 15 12 9 6"></polyline>
        </svg>

      <!-- 2. 真人實名認證 -->
      <a href="identity-verification.html" class="dp-menu-item">

            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
            <path d="M9 12l2 2 4-4"></path>
          </svg>
        </div>
        <div class="dp-menu-content">
          <span class="dp-menu-text">實名與真人認證</span>
          <span class="dp-tag-success">已驗證</span>
        </div>
        <svg class="dp-arrow-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="9 18 15 12 9 6"></polyline>
        </svg>
      </a>
    </div>

      <a href="blocked-users.html" class="dp-menu-item">

        <svg class="dp-arrow-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="9 18 15 12 9 6"></polyline>
        </svg>
      </a>

      <!-- 4. 檢舉與申訴紀錄 -->
      <a href="report-user.html" class="dp-menu-item">
        <div class="dp-menu-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">

          <polyline points="9 18 15 12 9 6"></polyline>
        </svg>
      </a>
