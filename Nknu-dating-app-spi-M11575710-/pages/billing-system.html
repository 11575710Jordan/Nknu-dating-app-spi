<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>課金系統 - 交友 App</title>

<!-- 引入 Google 品牌字型（與各頁一致） -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">

<!-- 引用主題變數與本頁樣式 -->
<link rel="stylesheet" href="../theme_guide/theme.css">
<link rel="stylesheet" href="../css/billing-system.css">
</head>
<body>

<div class="dp-card">
  <div class="dp-header">
    <div class="dp-header-top">
      <a href="user-center.html" class="dp-btn-back" title="返回個人中心">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20">
          <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
        <span>個人中心</span>
      </a>
    </div>

    <div class="dp-badge">
      <svg class="dp-badge-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="1" y="4" width="22" height="16" rx="2"></rect>
        <line x1="1" y1="10" x2="23" y2="10"></line>
      </svg>
      課金系統
    </div>
    <h1>點數儲值</h1>
    <p>選擇方案儲值，點數可用於解鎖動態、開通聊天或兌換商店裝飾。</p>
  </div>

  <div class="dp-alert dp-alert--info" style="display:block; margin-bottom: var(--sp-5);">
    這是純前端 Demo，不會產生真實金流或扣款，儲值只會模擬處理流程並直接加點數。
  </div>

  <!-- 未登入提示（不自動導頁，因為子資料夾頁面無法正確帶回登入後的頁面） -->
  <div class="dp-alert dp-alert--warning" id="guestNotice" style="display:none;">
    尚未登入，無法進行儲值。請先
    <a href="login.html">前往登入</a>，登入後重新整理這一頁即可儲值。
  </div>

  <div id="billingRoot" style="display:none;">

    <!-- 目前點數 -->
    <div class="balance-card">
      <div class="balance-card__label">目前可用點數</div>
      <div class="balance-card__value"><span id="balanceNumber">0</span> <small>點</small></div>
    </div>

    <!-- 儲值方案 -->
    <div class="dp-section-title">選擇儲值方案</div>
    <ul class="plan-list" id="planList"></ul>

    <!-- 快速入口 -->
    <div class="dp-section-title">其他功能</div>
    <div class="task-nav">
      <a class="dp-btn dp-btn--secondary dp-btn--sm" href="points-system.html">查看點數與兌換</a>
      <a class="dp-btn dp-btn--secondary dp-btn--sm" href="task-system.html">去完成任務賺點數</a>
    </div>

    <!-- 儲值紀錄 -->
    <div class="dp-section-title">儲值紀錄</div>
    <ul class="log-list" id="logList"></ul>
    <p class="dp-sm dp-muted" id="logEmpty" style="display:none;">目前還沒有任何儲值紀錄。</p>

    <div class="dp-alert" id="billingAlert" role="status" aria-live="polite" style="display:none;"></div>
  </div>

</div>

<script src="../data/mock-data.js"></script>
<script src="../js/session.js"></script>
<script src="../js/match-logic.js"></script>
<script src="../js/points-api.js"></script>
<script src="../js/billing-system.js"></script>
</body>
</html>
