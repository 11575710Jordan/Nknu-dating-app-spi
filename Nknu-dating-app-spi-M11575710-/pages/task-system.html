<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>任務系統 - 交友 App</title>

<!-- 引入 Google 品牌字型（與各頁一致） -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">

<!-- 引用主題變數與本頁樣式 -->
<link rel="stylesheet" href="../theme_guide/theme.css">
<link rel="stylesheet" href="../css/task-system.css">
</head>
<body>

<div class="dp-card">
  <div class="dp-header">
    <div class="dp-header-top">
      <a href="user-center.html" class="dp-btn-back" title="返回個人中心">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20">
          <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
        <span>個人中心</span>
      </a>
    </div>

    <div class="dp-badge">
      <svg class="dp-badge-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M9 11l3 3L22 4"></path>
        <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path>
      </svg>
      任務系統
    </div>
    <h1>每日任務與成就</h1>
    <p>完成任務可以領取點數，點數能在集點系統兌換小獎勵，或用來解鎖配對對象的動態。</p>
  </div>

  <!-- 未登入提示（不自動導頁，因為子資料夾頁面無法正確帶回登入後的頁面） -->
  <div class="dp-alert dp-alert--warning" id="guestNotice" style="display:none;">
    尚未登入，無法記錄你的任務進度。請先
    <a href="login.html">前往登入</a>，登入後重新整理這一頁即可開始任務。
  </div>

  <div id="taskRoot" style="display:none;">

    <!-- 每日簽到 -->
    <div class="dp-section-title">每日簽到</div>
    <div class="checkin-card" id="checkinCard">
      <div class="checkin-card__info">
        <div class="checkin-card__icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
        </div>
        <div>
          <strong>今日簽到</strong>
          <p class="dp-sm dp-muted" id="checkinStreak">連續簽到 0 天</p>
        </div>
      </div>
      <button type="button" class="dp-btn dp-btn--primary dp-btn--sm" id="checkinBtn">簽到領 +10 點</button>
    </div>

    <!-- 成就任務 -->
    <div class="dp-section-title">成就任務</div>
    <p class="dp-sm dp-muted" style="margin:0 0 var(--sp-4);">以下任務會自動偵測你在其他頁面的操作，完成後回來這裡領取獎勵（一生一次）。</p>
    <ul class="task-list" id="taskList"></ul>

    <!-- 快速入口 -->
    <div class="dp-section-title">點數相關功能</div>
    <div class="task-nav">
      <a class="dp-btn dp-btn--secondary dp-btn--sm" href="points-system.html">查看點數與兌換</a>
      <a class="dp-btn dp-btn--secondary dp-btn--sm" href="billing-system.html">點數不夠？去儲值</a>
    </div>

    <div class="dp-alert" id="taskAlert" role="status" aria-live="polite" style="display:none;"></div>
  </div>

</div>

<script src="../data/mock-data.js"></script>
<script src="../js/session.js"></script>
<script src="../js/points-api.js"></script>
<script src="../js/task-system.js"></script>
</body>
</html>
