<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>真人實名認證 - 交友 App</title>
  
  <!-- 引入 Google 品牌字型 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">

  <!-- 引用外部樣式表 -->
  <link rel="stylesheet" href="../theme_guide/theme.css">
  <link rel="stylesheet" href="../css/identity-verification.css">
</head>
<body>

  <div class="dp-card">
    <div class="dp-header">
      <!-- 頂部返回導覽 -->
      <div class="dp-header-top">
        <a href="user-center.html" class="dp-btn-back" title="返回個人中心">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20">
            <polyline points="15 18 9 12 15 6"></polyline>
          </svg>
          <span>個人中心</span>
        </a>
      </div>

      <div class="dp-badge">
        <svg class="dp-badge-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
          <path d="M9 12l2 2 4-4"></path>
        </svg>
        真人安全防護
      </div>
      <h1>完成真人實名認證</h1>
      <p>為保障社群品質與配對安全，請完成身份驗證以解鎖完整交友功能。</p>
    </div>

    <form id="verifyForm">
      <!-- 步驟 1：真實姓名與身分證號 -->
      <div class="dp-section-title">Step 1. 基本身分資訊</div>
      <div class="dp-form-row">
        <div class="dp-field">
          <label class="dp-label" for="realName">真實姓名<span class="required">*</span></label>
          <input type="text" class="dp-input" id="realName" placeholder="請輸入證件姓名" required>
        </div>
        <div class="dp-field">
          <label class="dp-label" for="idNumber">身分證字號 / 護照號碼<span class="required">*</span></label>
          <input type="text" class="dp-input" id="idNumber" placeholder="例如：A123456789" required>
        </div>
      </div>

      <!-- 步驟 2：證件照片上傳 -->
      <div class="dp-section-title">Step 2. 上傳有效身分證件</div>
      <div class="dp-upload-grid">
        <!-- 證件正面 -->
        <div class="dp-upload-box" id="idFrontBox">
          <input type="file" id="idFrontInput" accept="image/*" class="dp-file-input">
          <div class="dp-upload-placeholder" id="idFrontPlaceholder">
            <svg class="dp-upload-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <rect x="3" y="4" width="18" height="16" rx="2"></rect>
              <circle cx="9" cy="10" r="2"></circle>
              <line x1="15" y1="8" x2="19" y2="8"></line>
              <line x1="15" y1="12" x2="19" y2="12"></line>
            </svg>
            <span class="dp-upload-text">點擊上傳「證件正面」</span>
            <span class="dp-upload-subtext">文字與照片需清晰可辨識</span>
          </div>
          <img id="idFrontPreview" class="dp-preview-img" alt="證件正面預覽">
        </div>

        <!-- 證件反面 -->
        <div class="dp-upload-box" id="idBackBox">
          <input type="file" id="idBackInput" accept="image/*" class="dp-file-input">
          <div class="dp-upload-placeholder" id="idBackPlaceholder">
            <svg class="dp-upload-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <rect x="3" y="4" width="18" height="16" rx="2"></rect>
              <line x1="7" y1="8" x2="17" y2="8"></line>
              <line x1="7" y1="12" x2="17" y2="12"></line>
            </svg>
            <span class="dp-upload-text">點擊上傳「證件反面」</span>
            <span class="dp-upload-subtext">需含完整地址與發證機關</span>
          </div>
          <img id="idBackPreview" class="dp-preview-img" alt="證件反面預覽">
        </div>
      </div>

      <!-- 步驟 3：真人自拍驗證 -->
      <div class="dp-section-title">Step 3. 真人動態自拍比對</div>
      <div class="dp-selfie-box">
        <div class="dp-selfie-info">
          <div class="dp-selfie-icon-wrap">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
              <circle cx="12" cy="13" r="4"></circle>
            </svg>
          </div>
          <div class="dp-selfie-text">
            <strong>即時鏡頭自拍比對</strong>
            <p>系統將比對個人檔案照與證件，確認無誤後自動銷毀原始影像。</p>
          </div>
        </div>
        <button type="button" class="dp-btn-secondary" id="startSelfieBtn">開啟鏡頭拍攝</button>
      </div>

      <!-- 隱私承諾 -->
      <div class="dp-privacy-notice">
        <svg class="dp-lock-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
        </svg>
        證件資訊僅用於真人身分核對，遵守金融級資安加密規範，絕不對外公開。
      </div>

      <!-- 提示訊息區塊 -->
      <div class="dp-alert" id="alertMessage" aria-live="polite"></div>

      <!-- 提交審核按鈕 -->
      <button type="submit" class="dp-btn-submit" id="submitBtn">提交實名審核</button>
    </form>
  </div>

  <script src="../js/identity-verification.js"></script>
</body>
</html>
